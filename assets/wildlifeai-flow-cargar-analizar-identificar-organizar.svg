<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de WildlifeAI: Cargar, Analizar, Identificar y Organizar</title>
  <desc id="desc">Grafico horizontal de cuatro pasos para explicar el funcionamiento de WildlifeAI.</desc>
  <rect width="1600" height="500" fill="#f7faf6"/>
  <text x="800" y="70" text-anchor="middle" fill="#004431" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Funcionamiento de WildlifeAI</text>
  <text x="800" y="108" text-anchor="middle" fill="#3f4944" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">De fotografias acumuladas a informacion util para la conservacion</text>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#004431" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L11 6 L2 10" fill="none" stroke="#0f5d46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g transform="translate(80 158)">
    <rect width="270" height="230" rx="18" fill="#ffffff" stroke="#dfe6e1" filter="url(#cardShadow)"/>
    <circle cx="135" cy="74" r="38" fill="#e8f6ef" stroke="#8ed5b7" stroke-width="2"/>
    <g transform="translate(111 50)" fill="none" stroke="#004431" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 44V8"/>
      <path d="M10 22 24 8l14 14"/>
      <path d="M6 44h36"/>
    </g>
    <text x="135" y="146" text-anchor="middle" fill="#004431" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Cargar</text>
    <text x="135" y="181" text-anchor="middle" fill="#3f4944" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Imagen o lote</text>
  </g>

  <line x1="370" y1="273" x2="465" y2="273" stroke="#0f5d46" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(485 158)">
    <rect width="270" height="230" rx="18" fill="#ffffff" stroke="#dfe6e1" filter="url(#cardShadow)"/>
    <circle cx="135" cy="74" r="38" fill="#e8f6ef" stroke="#8ed5b7" stroke-width="2"/>
    <g transform="translate(109 48)" fill="none" stroke="#004431" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="18"/>
      <path d="M26 2v9"/>
      <path d="M26 41v9"/>
      <path d="M2 26h9"/>
      <path d="M41 26h9"/>
      <path d="M10 10l7 7"/>
      <path d="M42 10l-7 7"/>
      <path d="M10 42l7-7"/>
      <path d="M42 42l-7-7"/>
    </g>
    <text x="135" y="146" text-anchor="middle" fill="#004431" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Analizar</text>
    <text x="135" y="181" text-anchor="middle" fill="#3f4944" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">IA procesa la imagen</text>
  </g>

  <line x1="775" y1="273" x2="870" y2="273" stroke="#0f5d46" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(890 158)">
    <rect width="270" height="230" rx="18" fill="#ffffff" stroke="#dfe6e1" filter="url(#cardShadow)"/>
    <circle cx="135" cy="74" r="38" fill="#e8f6ef" stroke="#8ed5b7" stroke-width="2"/>
    <g transform="translate(107 48)" fill="none" stroke="#004431" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="32" rx="5"/>
      <circle cx="28" cy="26" r="9"/>
      <path d="M14 10l5-8h18l5 8"/>
      <path d="M45 45l10 10"/>
    </g>
    <text x="135" y="146" text-anchor="middle" fill="#004431" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Identificar</text>
    <text x="135" y="181" text-anchor="middle" fill="#3f4944" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Especie y confianza</text>
  </g>

  <line x1="1180" y1="273" x2="1275" y2="273" stroke="#0f5d46" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1295 158)">
    <rect width="270" height="230" rx="18" fill="#ffffff" stroke="#dfe6e1" filter="url(#cardShadow)"/>
    <circle cx="135" cy="74" r="38" fill="#e8f6ef" stroke="#8ed5b7" stroke-width="2"/>
    <g transform="translate(110 49)" fill="none" stroke="#004431" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 8h36v40H8z"/>
      <path d="M16 18h20"/>
      <path d="M16 28h20"/>
      <path d="M16 38h12"/>
      <path d="M42 8l8 8"/>
    </g>
    <text x="135" y="146" text-anchor="middle" fill="#004431" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Organizar</text>
    <text x="135" y="181" text-anchor="middle" fill="#3f4944" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Historial y estadisticas</text>
  </g>
</svg>
